<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多乐的星星屋</title>
  <link rel="preload" href="./fonts/ZCOOLKuaiLe-Regular.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="./styles.css?v=20260712-webfont" />
</head>
<body>
  <div class="sky" aria-hidden="true">
    <span class="bow bow-one"></span>
    <span class="bow bow-two"></span>
    <span class="cloud cloud-one"></span>
    <span class="cloud cloud-two"></span>
    <span class="heart heart-one">♥</span>
    <span class="heart heart-two">♥</span>
  </div>

  <main class="app-shell">
    <header class="hero">
      <section class="hero-copy">
        <div class="hero-topline">
          <p class="eyebrow">Sweet Star House</p>
          <button id="soundToggle" class="sound-toggle" type="button" aria-label="关闭声音" title="关闭声音"><span id="soundIcon" aria-hidden="true">🔊</span></button>
        </div>
        <h1>多乐的星星屋</h1>
        <p class="subtitle">把今天的小努力，装进软乎乎的星星罐。认真学习、开心阅读，每一颗都闪闪发光。</p>
        <div class="mascot-card" aria-label="星星小助手">
          <div class="mascot-face"><span class="mascot-bow"></span><span class="eye left"></span><span class="eye right"></span><span class="nose"></span></div>
          <div class="speech-bubble">今天也要甜甜地加油呀！</div>
        </div>
      </section>
      <section class="star-jar" aria-label="当前星星余额">
        <div class="jar-lid"></div>
        <div class="jar-body">
          <div id="jarStars" class="jar-stars"></div>
          <div class="balance-number"><span id="balanceValue">0</span><small>颗星</small></div>
        </div>
      </section>
    </header>

    <section class="stats-grid" aria-label="星星概览">
      <article class="stat-card peach">
        <span class="stat-label">今日获得</span>
        <strong id="todayValue">0</strong>
        <span>颗星</span>
      </article>
      <article class="stat-card green">
        <span class="stat-label">本周获得</span>
        <strong id="weekValue">0</strong>
        <span>颗星</span>
      </article>
    </section>

    <section class="sticker-strip" aria-label="今日鼓励贴纸">
      <span>🎀 坚持</span>
      <span>⭐ 努力</span>
      <span>☁️ 阅读</span>
      <span>🍮 兑换</span>
    </section>

    <section class="panel tasks-panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Earn Stars</p>
          <h2>今天摘哪颗星？</h2>
        </div>
        <div class="task-actions">
          <button id="refreshRewardsButton" class="subtle-button" type="button">刷新</button>
        </div>
      </div>

      <div id="taskGrid" class="task-grid">
        <div class="empty task-loading">正在从 Notion 取回任务...</div>
      </div>
    </section>

    <section class="content-grid">
      <article class="panel shop-panel">
        <div class="panel-heading compact">
          <div>
            <p class="eyebrow">Notion Gifts</p>
            <h2>甜心礼物屋</h2>
          </div>
          <button id="refreshGiftsButton" class="subtle-button" type="button">刷新</button>
        </div>
        <div id="shopList" class="shop-list"></div>
      </article>

      <article class="panel spend-panel">
        <div class="panel-heading compact">
          <div>
            <p class="eyebrow">Spend</p>
            <h2>兑换心愿礼物</h2>
          </div>
        </div>
        <form id="spendForm" class="stack-form">
          <label>兑换内容<input name="item" placeholder="10 元小玩具" required /></label>
          <label>消耗星星<input name="stars" type="number" min="1" max="200" value="10" required /></label>
          <label>兑换照片或视频（可选）<input name="media" type="file" accept="image/*,video/*" multiple /></label>
          <button type="submit">确认兑换</button>
        </form>
      </article>
    </section>

    <section class="panel ledger-panel">
      <div class="panel-heading compact">
        <div>
          <p class="eyebrow">History</p>
          <h2>闪亮成长册</h2>
        </div>
      </div>
      <div id="ledgerList" class="ledger-list"></div>
    </section>
  </main>

  <dialog id="mediaDialog" class="app-dialog media-dialog">
    <div class="dialog-card media-card">
      <div class="media-heading">
        <h2 id="mediaViewerTitle">礼品预览</h2>
        <button id="closeMediaButton" class="media-close" type="button" aria-label="关闭预览">×</button>
      </div>
      <div id="mediaViewer" class="media-viewer"></div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js?v=20260712-webfont" type="module"></script>
</body>
</html>
